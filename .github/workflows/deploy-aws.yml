# Publica la web en AWS (S3 + CloudFront) en cada push a main.
# Se activa solo cuando existen las variables del repo AWS_ROLE_ARN, AWS_BUCKET y AWS_CF_DIST.
name: Deploy a AWS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  id-token: write   # para entrar a AWS con OIDC, sin claves guardadas
  contents: read
concurrency: deploy-aws
jobs:
  deploy:
    if: ${{ vars.AWS_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow==11.0.0
      - name: Construir versión estática
        run: python herramientas/build_estatico.py . _site
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-2
      - name: Subir a S3
        run: |
          aws s3 sync _site "s3://${{ vars.AWS_BUCKET }}" --delete \
            --exclude "*.html" --cache-control "public,max-age=2592000"
          aws s3 sync _site "s3://${{ vars.AWS_BUCKET }}" --delete \
            --exclude "*" --include "*.html" --cache-control "public,max-age=0,must-revalidate"
      - name: Invalidar caché de CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.AWS_CF_DIST }}" --paths "/*"
