# Copia al repositorio las fotos que la web aún pide a jocecia.com (WordPress) y cambia los enlaces.
# Se ejecuta a mano desde la pestaña Actions ("Run workflow"). Ver herramientas/traer_fotos_wp.py.
name: Traer fotos de WordPress
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  traer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python3 herramientas/traer_fotos_wp.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A img/wp herramientas/fotos-wp.json
          git add -u
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Fotos de WordPress copiadas a /img/wp y enlaces actualizados"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
